name: Windows installer
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: PowerShell 5.1 tests
        shell: powershell
        run: ./test-installer.ps1
      - name: Build self-contained installer
        shell: powershell
        run: ./build.ps1
      - name: Check embedded payload
        shell: pwsh
        run: ./test-payload.ps1 -Installer ./dist/VEKTOR-Setup-x64.exe -OutputDir "$env:RUNNER_TEMP/vektor-payload"
      - uses: actions/upload-artifact@v4
        with:
          name: VEKTOR-Windows-x64
          path: |
            dist/VEKTOR-Setup-x64.exe
            dist/SHA256SUMS.txt
            dist/release.json
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$env:RELEASE_TAG" dist/VEKTOR-Setup-x64.exe dist/SHA256SUMS.txt dist/release.json --title "VEKTOR Windows $env:RELEASE_TAG" --notes-file RELEASE_NOTES.md
