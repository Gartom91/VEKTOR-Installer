name: vektor-desktop
services:
  agent:
    image: ${VEKTOR_IMAGE:?Required pinned image}
    ports: ["127.0.0.1:${VEKTOR_PORT:-8765}:8765"]
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${CLOUD_MODEL:-glm-5.3:cloud}
      OLLAMA_STRONG_MODEL: ${STRONG_MODEL:-glm-5.3:cloud}
      OLLAMA_VISION_MODEL: ${VISION_MODEL:-glm-5.3-flash:cloud}
      VISION_AUTO: ${VISION_AUTO:-true}
      VISION_FOLLOWUP_LIMIT: ${VISION_FOLLOWUP_LIMIT:-2}
      OLLAMA_LOCAL_MODEL: ${LOCAL_MODEL:-qwen3:4b}
      OLLAMA_LOCAL_VISION_MODEL: gemma3:4b
      OLLAMA_LOCAL_CONTEXT: ${LOCAL_CONTEXT:-4096}
      MODEL_MODE: ${MODEL_MODE:-auto}
      FULL_ACCESS_ENABLED: "false"
      DATABASE_URL: sqlite:////app/data/agent.db
      WORKSPACE_ROOT: /app/workspace
      HOST_ACCESS_ENABLED: ${HOST_ENABLED:-false}
      HOST_BROKER_URL: http://host.docker.internal:${BROKER_PORT:-8877}
      HOST_BROKER_TOKEN: ${BROKER_TOKEN:-}
      STABLE_DIFFUSION_URL: http://stable-diffusion:8770
      STABLE_DIFFUSION_TOKEN_FILE: /run/vektor-sd/token
    volumes:
      - agent-data:/app/data
      - ${VEKTOR_WORKSPACE:?Required workspace}:/app/workspace
      - stable-diffusion-auth:/run/vektor-sd:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
    depends_on:
      ollama: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health',timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s
  ollama:
    image: ${OLLAMA_IMAGE:?Required pinned image}
    environment:
      OLLAMA_CONTEXT_LENGTH: ${LOCAL_CONTEXT:-4096}
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_FLASH_ATTENTION: "true"
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_KEEP_ALIVE: 5m
    volumes: ["ollama-data:/root/.ollama"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
  stable-diffusion:
    profiles: ["images"]
    image: ${DIFFUSION_IMAGE:?Required pinned diffusion image}
    environment:
      SD_MODELS_ROOT: /models
      SD_TOKEN_FILE: /run/vektor-sd/token
    volumes:
      - stable-diffusion-models:/models
      - stable-diffusion-auth:/run/vektor-sd
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8770/health',timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
volumes:
  agent-data:
  ollama-data:
  stable-diffusion-models:
  stable-diffusion-auth:
